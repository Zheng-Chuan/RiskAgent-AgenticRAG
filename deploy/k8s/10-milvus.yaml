# Milvus standalone 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: riskagent
  labels:
    app.kubernetes.io/name: milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milvus
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.12
          imagePullPolicy: IfNotPresent
          command: ["milvus", "run", "standalone"]
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: ETCD_USE_EMBED
              value: "true"
            - name: ETCD_DATA_DIR
              value: /var/lib/milvus/etcd
            - name: ETCD_CONFIG_PATH
              value: /milvus/configs/embedEtcd.yaml
            - name: COMMON_STORAGETYPE
              value: local
            - name: DEPLOY_MODE
              value: STANDALONE
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: health
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus
            - name: milvus-config
              mountPath: /milvus/configs/embedEtcd.yaml
              subPath: embedEtcd.yaml
            - name: milvus-config
              mountPath: /milvus/configs/user.yaml
              subPath: user.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: milvus-data
          persistentVolumeClaim:
            claimName: milvus-pvc
        - name: milvus-config
          configMap:
            name: milvus-config

---
# Milvus 持久化存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-pvc
  namespace: riskagent
  labels:
    app.kubernetes.io/name: milvus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Milvus Service
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: riskagent
  labels:
    app.kubernetes.io/name: milvus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: health
      port: 9091
      targetPort: 9091
