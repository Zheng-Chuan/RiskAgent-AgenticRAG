# RiskAgent API 应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riskagent-api
  namespace: riskagent
  labels:
    app.kubernetes.io/name: riskagent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: riskagent-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riskagent-api
    spec:
      # 等待 Milvus 和 Redis 就绪
      initContainers:
        - name: wait-milvus
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              echo "等待 Milvus 就绪..."
              until curl -sf http://milvus:9091/healthz; do
                echo "Milvus 未就绪 等待中..."
                sleep 5
              done
              echo "Milvus 已就绪"
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              echo "等待 Redis 就绪..."
              until redis-cli -h redis -p 6379 -a riskagent ping | grep PONG; do
                echo "Redis 未就绪 等待中..."
                sleep 3
              done
              echo "Redis 已就绪"
      containers:
        - name: api
          image: riskagent-agenticrag:v10c-fix
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: riskagent-config
            - secretRef:
                name: riskagent-secret
          env:
            - name: PYTHONPATH
              value: "/app/src"
          volumeMounts:
            - name: app-data
              mountPath: /app/.milvus
            - name: app-artifacts
              mountPath: /app/.artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: riskagent-data-pvc
        - name: app-artifacts
          emptyDir: {}

---
# 应用持久化存储 (Milvus 索引数据)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: riskagent-data-pvc
  namespace: riskagent
  labels:
    app.kubernetes.io/name: riskagent-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# API Service (NodePort 暴露到本地)
apiVersion: v1
kind: Service
metadata:
  name: riskagent-api
  namespace: riskagent
  labels:
    app.kubernetes.io/name: riskagent-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: riskagent-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
